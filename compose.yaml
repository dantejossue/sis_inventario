services:
  web:
    build:
      context: .
      target: web

    image: sis-inventario-web:dev
    container_name: sis-inventario-web

    restart: unless-stopped

    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'

    depends_on:
      - app

    volumes:
      - sis-inventario-storage:/var/www/html/storage/app:ro

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/up >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - sis-inventario

  app:
    build:
      context: .
      target: runtime

    image: sis-inventario-app:dev
    container_name: sis-inventario-app

    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}

      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      OCS_API_URL: ${OCS_API_URL}
      OCS_API_TIMEOUT: ${OCS_API_TIMEOUT}

    volumes:
      - sis-inventario-storage:/var/www/html/storage/app

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - sis-inventario

  mysql:
    image: mysql:8.4
    container_name: sis-inventario-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - sis-inventario-mysql-data:/var/lib/mysql

    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - sis-inventario

networks:
  sis-inventario:
    name: sis-inventario-net

volumes:
  sis-inventario-mysql-data:
    name: sis-inventario-mysql-data

  sis-inventario-storage:
    name: sis-inventario-storage
